# Caddy terminates TLS in production and sends the original scheme in
# X-Forwarded-Proto; pass it through so the API builds https URLs. With no
# proxy in front (dev/test, port published directly) fall back to our own.
map $http_x_forwarded_proto $dmtc_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dmtc_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
