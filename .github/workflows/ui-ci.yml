# Continuous integration for the DMTC user interface (ui/).
#
# Runs on every push to the three workflow branches and on pull requests
# into them. Installs from the lockfile, lints, builds the production
# bundle, reports dependency vulnerabilities, and proves the Docker
# production image builds. The built bundle is kept as a workflow
# artifact for 14 days so a reviewer can inspect it without building.

name: UI CI

on:
  push:
    branches: [devel, testing, master]
    paths:
      - "ui/**"
      - ".gitmodules"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    branches: [devel, testing, master]
    paths:
      - "ui/**"
      - ".gitmodules"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install (from lockfile)
        run: npm ci

      - name: Lint
        run: npx vue-cli-service lint --no-fix

      - name: Build production bundle
        run: npm run build
        env:
          VUE_APP_API_BASE: ""

      - name: Audit runtime dependencies
        # Reported, not blocking, until the dependency upgrade lands.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 14

  docker:
    name: Docker image builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build production image
        run: docker build --target production -t dmtc-ui:ci ui
